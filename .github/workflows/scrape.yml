name: Scrape GamesDB

on:
  workflow_dispatch:
  schedule:
    # Chạy tự động lúc 03:00 AM UTC vào ngày 1 hàng tháng
    - cron: '0 3 1 * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install node-fetch@2 --no-save

      - name: Run integrated scraper
        run: node scrape_gamesdb.js

      - name: Commit results
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add data/*.csv || echo "Không có file dữ liệu mới"
          git commit -m "Update scraped games data [skip ci]" || echo "Không có thay đổi"
          git push
