<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xem dữ liệu CSV | GamesDB Viewer</title>

<!-- Bootstrap 5 CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<!-- Tabulator CSS (Giao diện mượt mà, hỗ trợ resize cột mặc định) -->
<link href="https://unpkg.com/tabulator-tables@5.5.4/dist/css/tabulator_bootstrap5.min.css" rel="stylesheet">

<style>
  body { background: #f8f9fa; padding: 20px; }
  #csvTable {
    border: 1px solid #dee2e6;
    border-radius: 6px;
    background: #fff;
  }
  /* Style cho các ô dữ liệu trong bảng */
  .tabulator-cell {
    white-space: nowrap !important;
    text-overflow: ellipsis !important;
    overflow: hidden !important;
    cursor: pointer;
  }
  .tabulator-cell:hover {
    background-color: #e2e8f0 !important;
  }
</style>
</head>
<body>

<div class="container-fluid">
  <h2 class="mb-3">📊 GamesDB CSV Viewer</h2>
  <p class="text-muted">Tự động lấy danh sách file trong <code>/data</code> của repo.</p>

  <div class="row g-2 align-items-center mb-3">
    <div class="col-auto">
      <select id="csvSelect" class="form-select"></select>
    </div>
    <div class="col-auto">
      <button id="loadBtn" class="btn btn-primary">Tải dữ liệu</button>
    </div>
    <div class="col-auto ms-auto">
      <input type="text" id="searchInput" class="form-select" placeholder="🔍 Tìm kiếm nhanh...">
    </div>
  </div>

  <!-- Bảng dữ liệu Tabulator -->
  <div id="csvTable"></div>
</div>

<!-- Modal xem chi tiết nội dung ô -->
<div class="modal fade" id="cellDetailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Chi tiết thông tin</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="modalBody" style="white-space: pre-wrap; word-break: break-word;"></div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/tabulator-tables@5.5.4/dist/js/tabulator.min.js"></script>

<script>
const repo = location.pathname.split('/')[1];
const owner = location.hostname.split('.')[0];
const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/data`;

let tableInstance = null;
const detailModal = new bootstrap.Modal(document.getElementById('cellDetailModal'));

// 1. Lấy danh sách file CSV từ GitHub API
async function listCSVFiles() {
  try {
    const res = await fetch(apiUrl);
    const files = await res.json();
    const csvFiles = Array.isArray(files) ? files.filter(f => f.name.endsWith('.csv')) : [];
    
    const select = document.getElementById('csvSelect');
    if (csvFiles.length > 0) {
      select.innerHTML = csvFiles.map(f => `<option value="${f.download_url}">${f.name}</option>`).join('');
    } else {
      select.innerHTML = '<option disabled selected>Không có file CSV nào</option>';
    }
  } catch (err) {
    alert('❌ Không thể lấy danh sách file CSV.\n' + err);
  }
}

// 2. Đọc file CSV và khởi tạo bảng Tabulator
async function loadCSV() {
  const url = document.getElementById('csvSelect').value;
  if (!url) return;

  const res = await fetch(url);
  const csvText = await res.text();

  Papa.parse(csvText, {
    header: true,
    skipEmptyLines: true,
    complete: results => {
      const data = results.data;
      if (data.length === 0) {
        alert("File CSV không có dữ liệu.");
        return;
      }

      // Tự động tạo cấu hình cột từ các key của dòng đầu tiên
      const headers = Object.keys(data[0]);
      const columns = headers.map(header => ({
        title: header,
        field: header,
        resizable: true,     // Bật tính năng kéo rê thay đổi chiều rộng cột
        headerFilter: true,  // Bật ô lọc dữ liệu theo từng cột
        tooltip: true        // Hiển thị tooltip ngắn khi rê chuột vào
      }));

      // Nếu bảng đã khởi tạo trước đó thì hủy để tạo bảng mới
      if (tableInstance) tableInstance.destroy();

      tableInstance = new Tabulator("#csvTable", {
        data: data,
        columns: columns,
        layout: "fitDataFill", // Cột tự co giãn vừa nội dung, cho phép cuộn ngang
        pagination: "local",
        paginationSize: 20,
        paginationSizeSelector: [10, 20, 50, 100],
        movableColumns: true,  // Cho phép kéo thả thay đổi vị trí các cột
        height: "70vh",        // Giới hạn chiều cao bảng và dùng Virtual DOM
      });

      // Sự kiện click vào ô bất kỳ để mở Modal chi tiết
      tableInstance.on("cellClick", function(e, cell){
        const fieldName = cell.getField();
        const cellValue = cell.getValue() ?? '';

        document.getElementById('modalTitle').innerText = fieldName;
        document.getElementById('modalBody').innerText = cellValue;
        detailModal.show();
      });
    }
  });
}

// 3. Lọc dữ liệu toàn bộ bảng từ ô tìm kiếm nhanh
document.getElementById('searchInput').addEventListener('keyup', function(e) {
  if (tableInstance) {
    tableInstance.setFilter(customGlobalFilter, e.target.value);
  }
});

function customGlobalFilter(data, filterValue) {
  if (!filterValue) return true;
  const term = filterValue.toLowerCase();
  return Object.values(data).some(val => String(val).toLowerCase().includes(term));
}

document.getElementById('loadBtn').addEventListener('click', loadCSV);
listCSVFiles();
</script>
</body>
</html>
