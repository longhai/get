<!DOCTYPE html>
<html lang="vi" data-bs-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamesDB CSV Viewer</title>

<!-- Bootstrap 5 CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<!-- Tabulator Standard CSS -->
<link id="tabulator-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.2/dist/css/tabulator.min.css">
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  body { 
    padding: 12px; 
    font-family: system-ui, -apple-system, sans-serif;
    transition: background-color 0.3s, color 0.3s;
  }
  
  /* Cấu hình linh hoạt CSS variables hỗ trợ Light/Dark mode tự động */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-card: #1e1e1e;
      --border-card: #2d2d2d;
      --tabulator-hover: #2a2a2a;
    }
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg-card: #ffffff;
      --border-card: #dee2e6;
      --tabulator-hover: #f1f3f5;
    }
  }

  .card-custom { 
    background-color: var(--bg-card); 
    border: 1px solid var(--border-card); 
    border-radius: 12px; 
  }
  
  /* Style ô bảng Tabulator */
  .tabulator { 
    font-size: 13px; 
    border-radius: 8px; 
    border: 1px solid var(--border-card); 
  }
  
  .tabulator-cell { 
    cursor: pointer; 
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  .tabulator-cell:hover { 
    background-color: var(--tabulator-hover) !important; 
  }
  
  /* Cấu hình Tooltip hiển thị rõ ràng */
  .tabulator-tooltip {
    background-color: #212529 !important;
    color: #fff !important;
    border: 1px solid #495057 !important;
    border-radius: 6px !important;
    padding: 6px 10px !important;
    font-size: 12px !important;
    max-width: 350px !important;
    white-space: normal !important;
    word-break: break-word !important;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3) !important;
  }
</style>
</head>
<body>

<div class="container-fluid p-0 max-width-lg">
  <div class="card card-custom mb-3">
    <div class="card-body p-3">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <h5 class="m-0 text-primary fw-bold"><i class="fa-solid fa-table-cells me-2"></i>GamesDB CSV Viewer</h5>
        <span id="statusBadge" class="badge bg-secondary">Sẵn sàng</span>
      </div>

      <div class="row g-2 align-items-center">
        <div class="col-12 col-md-6">
          <label for="csvSelect" class="form-label fw-bold small text-muted mb-1">Chọn tệp CSV</label>
          <div class="input-group input-group-sm">
            <span class="input-group-text"><i class="fa-solid fa-file-csv"></i></span>
            <select id="csvSelect" class="form-select"></select>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <label for="searchInput" class="form-label fw-bold small text-muted mb-1">Tìm kiếm nhanh</label>
          <div class="input-group input-group-sm">
            <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" id="searchInput" class="form-control" placeholder="Nhập từ khóa tìm kiếm..." disabled>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card card-custom">
    <div class="card-body p-2">
      <div id="csvTable"></div>
    </div>
  </div>
</div>

<!-- Modal xem chi tiết ô -->
<div class="modal fade" id="cellDetailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle"><i class="fa-solid fa-circle-info me-2"></i>Chi tiết thông tin</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <pre id="modalBody" class="p-3 bg-body-tertiary rounded border mb-0" style="white-space: pre-wrap; word-break: break-word; font-family: monospace; font-size: 13px;"></pre>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Tự động load CSS Theme Tabulator phù hợp với Dark/Light Mode hệ thống
function updateTabulatorTheme() {
  const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const themeLink = document.getElementById('tabulator-theme');
  if (isDark) {
    themeLink.href = "https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.2/dist/css/tabulator_midnight.min.css";
  } else {
    themeLink.href = "https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.2/dist/css/tabulator.min.css";
  }
}
updateTabulatorTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTabulatorTheme);

let tableInstance = null;
const repo = location.pathname.split('/')[1] || '';
const owner = location.hostname.split('.')[0] || '';
const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/data`;

const statusBadge = document.getElementById('statusBadge');
const csvSelect = document.getElementById('csvSelect');
const searchInput = document.getElementById('searchInput');
const detailModal = new bootstrap.Modal(document.getElementById('cellDetailModal'));

function setStatus(text, bgClass = 'bg-secondary') {
  statusBadge.className = `badge ${bgClass}`;
  statusBadge.textContent = text;
}

async function listCSVFiles() {
  setStatus('Đang tải...', 'bg-warning text-dark');
  try {
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
    const files = await res.json();
    const csvFiles = files.filter(f => f.name.toLowerCase().endsWith('.csv'));

    if (csvFiles.length === 0) {
      csvSelect.innerHTML = '<option disabled>Không có file CSV</option>';
      setStatus('Không có dữ liệu', 'bg-danger');
      return;
    }

    csvSelect.innerHTML = csvFiles.map(f => `<option value="${f.download_url}">${f.name}</option>`).join('');
    loadCSV(csvSelect.value);
  } catch (err) {
    csvSelect.innerHTML = '<option disabled>Thất bại khi lấy tệp</option>';
    setStatus('Lỗi API', 'bg-danger');
  }
}

async function loadCSV(url) {
  if (!url) return;
  
  setStatus('Đang đọc CSV...', 'bg-primary');
  searchInput.value = '';
  searchInput.disabled = true;

  try {
    const res = await fetch(url);
    const csvText = await res.text();

    Papa.parse(csvText, {
      header: true,
      skipEmptyLines: true,
      complete: results => {
        const data = results.data;
        if (!data || data.length === 0) {
          setStatus('File rỗng', 'bg-warning text-dark');
          if (tableInstance) tableInstance.clearData();
          return;
        }

        renderTable(data);
        setStatus(`Đã tải ${data.length} dòng`, 'bg-success');
        searchInput.disabled = false;
      }
    });
  } catch (err) {
    setStatus('Lỗi tải file', 'bg-danger');
  }
}

function renderTable(data) {
  const headers = Object.keys(data[0]);
  
  const columns = headers.map(h => ({
    title: h,
    field: h,
    resizable: true,
    minWidth: 100,
    maxWidth: 300,
    tooltip: function(e, cell) {
      const val = cell.getValue();
      return val ? String(val) : false;
    },
    formatter: cell => cell.getValue() ?? ''
  }));

  if (tableInstance) {
    tableInstance.destroy();
  }

  tableInstance = new Tabulator("#csvTable", {
    data: data,
    columns: columns,
    layout: "fitColumns",
    pagination: "local",
    paginationSize: 15,
    paginationSizeSelector: [10, 15, 30, 50],
    movableColumns: true,
    placeholder: "Không tìm thấy dữ liệu phù hợp",
    cellClick: (e, cell) => {
      const fieldName = cell.getColumn().getField();
      const value = cell.getValue() ?? '';
      
      document.getElementById('modalTitle').innerText = fieldName;
      document.getElementById('modalBody').textContent = String(value);
      detailModal.show();
    }
  });
}

csvSelect.addEventListener('change', (e) => loadCSV(e.target.value));

searchInput.addEventListener('keyup', (e) => {
  if (!tableInstance) return;
  const keyword = e.target.value.trim().toLowerCase();
  
  if (keyword === '') {
    tableInstance.clearFilter();
    return;
  }

  tableInstance.setFilter((data) => {
    return Object.values(data).some(val => {
      if (val === null || val === undefined) return false;
      return String(val).toLowerCase().includes(keyword);
    });
  });
});

listCSVFiles();
</script>

</body>
</html>
