<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xem dữ liệu CSV | GamesDB Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
<style>
  body { background: #f8f9fa; padding: 20px; }
  table { font-size: 13px; table-layout: fixed; width: 100% !important; }
  td {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    vertical-align: top;
  }
  td:hover { background-color: #e9ecef; }
  /* Con trỏ hiển thị thanh kéo cột */
  .JRCable, .JCSdl { cursor: col-resize !important; }
</style>
</head>
<body>
<div class="container-fluid">
  <h2 class="mb-3">📊 GamesDB CSV Viewer</h2>
  <p class="text-muted">Tự động lấy danh sách file trong <code>/data</code> của repo.</p>

  <div class="mb-3">
    <label class="form-label">Chọn tệp CSV:</label>
    <select id="csvSelect" class="form-select w-auto d-inline-block"></select>
    <button id="loadBtn" class="btn btn-primary ms-2">Tải dữ liệu</button>
  </div>

  <div id="tableContainer" class="table-responsive mt-4"></div>
</div>

<!-- Modal xem chi tiết nội dung ô -->
<div class="modal fade" id="cellDetailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Chi tiết thông tin</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="modalBody" style="white-space: pre-wrap; word-break: break-word;"></div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Thư viện kéo giãn kích thước cột -->
<script src="https://cdn.jsdelivr.net/npm/colresizable@1.6.0/colResizable-1.6.min.js"></script>

<script>
const repo = location.pathname.split('/')[1];
const owner = location.hostname.split('.')[0];
const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/data`;

async function listCSVFiles() {
  try {
    const res = await fetch(apiUrl);
    const files = await res.json();
    const csvFiles = files.filter(f => f.name.endsWith('.csv'));
    const select = document.getElementById('csvSelect');
    select.innerHTML = csvFiles.map(f => `<option value="${f.download_url}">${f.name}</option>`).join('');
    if (csvFiles.length === 0) select.innerHTML = '<option disabled>Không có file CSV</option>';
  } catch (err) {
    alert('❌ Không thể lấy danh sách file CSV.\n' + err);
  }
}

async function loadCSV() {
  const url = document.getElementById('csvSelect').value;
  if (!url) return;
  const container = document.getElementById('tableContainer');
  container.innerHTML = "<p class='text-muted'>⏳ Đang tải...</p>";

  const res = await fetch(url);
  const csvText = await res.text();

  Papa.parse(csvText, {
    header: true,
    skipEmptyLines: true,
    complete: results => {
      const data = results.data;
      if (data.length === 0) {
        container.innerHTML = "<p class='text-danger'>File CSV trống.</p>";
        return;
      }

      const headers = Object.keys(data[0]);
      let tableHTML = `<table id="csvTable" class="table table-striped table-bordered"><thead><tr>`;
      headers.forEach(h => tableHTML += `<th>${h}</th>`);
      tableHTML += `</tr></thead><tbody>`;

      data.forEach(row => {
        tableHTML += '<tr>';
        headers.forEach(h => {
          let cellText = row[h] ?? '';
          tableHTML += `<td data-fulltext="${cellText.replace(/"/g, '&quot;')}" data-header="${h}">${cellText}</td>`;
        });
        tableHTML += '</tr>';
      });

      tableHTML += '</tbody></table>';
      container.innerHTML = tableHTML;

      // Khởi tạo DataTables
      const table = $('#csvTable').DataTable({
        pageLength: 20,
        scrollX: true,
        order: [],
        language: {
          search: "Tìm kiếm:",
          lengthMenu: "Hiển thị _MENU_ dòng",
          info: "Hiển thị _START_ - _END_ / _TOTAL_ dòng",
          paginate: { previous: "Trước", next: "Sau" }
        },
        initComplete: function () {
          // Bật tính năng kéo rê thay đổi chiều rộng cột
          $("#csvTable").colResizable({
            liveDrag: true,
            gripInnerHtml: "<div class='grip'></div>",
            draggingClass: "dragging",
            resizeMode: 'overflow'
          });
        }
      });

      // Sự kiện Click vào ô để xem nội dung đầy đủ
      const detailModal = new bootstrap.Modal(document.getElementById('cellDetailModal'));
      $('#csvTable tbody').on('click', 'td', function () {
        const fullText = $(this).attr('data-fulltext') || $(this).text();
        const headerName = $(this).attr('data-header') || 'Chi tiết';
        
        document.getElementById('modalTitle').innerText = headerName;
        document.getElementById('modalBody').innerText = fullText;
        detailModal.show();
      });
    }
  });
}

document.getElementById('loadBtn').addEventListener('click', loadCSV);
listCSVFiles();
</script>
</body>
</html>
